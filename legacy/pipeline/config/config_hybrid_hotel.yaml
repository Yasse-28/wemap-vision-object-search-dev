# Hybrid offline pipeline config for hotel venue.
# Targets /localize (no offline clustering).
# Run with:
#   python -m pipeline.offline.build_index \
#       --map_path <map_path> --config pipeline/config/config_hybrid_hotel.yaml

venue: hotel

offline:
  # Batching + prefetch
  mini_batch_size: 1          # ERPs per GPU forward call; bump to 6-8 on A10G
  prefetch_workers: 2         # I/O + cubemap-extract threads (each finishes well before GPU)
  prefetch_queue: 4           # ERP buffers queued ahead; 200 MB RAM budget
  post_process_pending: 2     # max post-process tasks queued behind the GPU loop

  # Post-processing filters (applied to the pooled YOLO+GDINO detections)
  nms_iou: 0.55               # class-agnostic spherical (FoV-IoU) NMS over the
                              # pooled YOLO+GDINO detections; 0 disables
  min_area_ratio: 0.0
  max_area_ratio: 0.95
  min_aspect_ratio: 0.05
  max_aspect_ratio: 20.0
  max_proposals_per_face: 30  # cap per cubemap face after projection

  # 3D localisation (positions for /localize shortcut path)
  localization:
    enabled: true
    depth_dir: depths
    min_depth_m: 0.05
    max_depth_m: 25.0
    skip_clustering: true     # clustering done online at request time

yolo_params:
  weights: yolov8s-worldv2.pt
  imgsz: 1600
  conf_broad: 0.04      # GENERIC_OBJECTS + PUBLIC_INFRA
  conf_specific: 0.03   # HOTEL_SPECIFIC (HOTEL_FURNITURE_VOCAB + SAFETY_SECURITY_VOCAB)
                        # Slightly higher than airport (0.03) — hotel rooms generate
                        # many soft-furnishing false positives at very low thresholds

gdino_params:
  model: IDEA-Research/grounding-dino-tiny  # change to grounding-dino-base for higher recall
  score: 0.06                 # GDINO model-level threshold
  min_confidence: 0.07        # post-process minimum confidence
  label: gdino_venue          # synthetic label stamped on all GDINO detections

# Lightweight PP-OCR (optional — disabled by default)
ocr:
  enabled: true              # set to true to run PP-OCR after detection
  textness_threshold: 0.02    # MetaCLIP textness score filter (objects above this get OCR)
  lightweight_lang: fr        # PaddleOCR language (fr, en, ...)
  lightweight_preprocess: raw # raw | upscale2 | upscale4_autocontrast | upscale6_autocontrast
  lightweight_min_score: 0.7  # min PP-OCR confidence to accept a read
  lightweight_single_letter_min_score: 0.85
