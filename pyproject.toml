[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wemap-object-search-dev"
version = "0.3.1"
description = "Dev platform for the object-search pipeline: bricks, workbench, benchmark. Consumes wemap-vision-object-search as a submodule."
readme = "README.md"
requires-python = ">=3.11"

# The pipeline's own dependencies are declared by the submodule; install it first:
#   pip install -e './third_party/object_search[prepare]'
#   pip install -e '.[dev]'
# Listed here is only what the dev code adds on top.
dependencies = [
    "pyproj",       # toolbox/georef/georef.py
    "tifffile",     # depth TIFF decode
    "imagecodecs",  # zstd-compressed depth TIFFs
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "mypy",
    "ruff",
    "httpx",  # fastapi TestClient
]

# Installs the dependencies above and no package. `toolbox` is imported from the
# tree with the repo root on sys.path, never installed — same as before the split.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["toolbox/tests"]
# Two sys.path roots. The second is the submodule: `prepare`, `inference` and
# `indexing` are top-level names there, exactly as production puts them on
# PYTHONPATH. Relative to rootdir, which is why the mount path is fixed rather
# than env-driven — see scripts/lib.sh for the shell-side equivalent.
pythonpath = [
    ".",                              # toolbox.*
    "third_party/object_search",      # prepare, inference, indexing
]
python_files = ["test_*.py"]
# The submodule runs its own suite (its 20 mirror tests) with its own config.
# Recursing into it here would drag in the annotation_service and
# object_search_online roots, whose flat `app.py` modules collide by name.
norecursedirs = ["legacy", "node_modules", ".git", "*.egg-info", "third_party"]

[tool.black]
line-length = 88
target-version = ["py311"]
# The submodule is mirrored production code; reformatting it would break its
# check-mirror.sh gate.
force-exclude = "^/(legacy|third_party)/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["legacy", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# toolbox/bricks/vendored/ is copied production code (see its PROVENANCE.md).
# Reflowing it would make the re-sync diff noisy for no benefit.
"toolbox/bricks/vendored/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# pgdata/ is the dev container's data directory: root-owned, so even listing it
# raises PermissionError.
exclude = ["^legacy/", "^infra/postgres/pgdata/", "^toolbox/node_modules/"]

# The submodule is not type-checked, and that is deliberate.
#
# We cannot fix an error in a byte-for-byte copy of production without diverging
# from it, so checking it would only produce findings we must suppress forever. Its
# typing is the backend's responsibility. We still need the modules importable so
# our own annotations resolve — hence `ignore_errors` rather than `exclude`.
#
# Run `scripts/check-types.sh`, which checks toolbox/ with the submodule on MYPYPATH.
[[tool.mypy.overrides]]
module = [
    "prepare.*",
    "inference.*",
    "indexing.*",
    "lib",
    "build_index",
    "build_index_pgvector",
    "query",
    "query_pgvector",
    "app",
    "db",
    "models",
    "service_state",
    "v1_legacy",
    "test.*",
]
ignore_errors = true
disallow_untyped_defs = false
warn_return_any = false

# Same rule, applied consistently: we do not type-check code we *copied*, only code
# we wrote. These modules are verbatim ports whose bodies must stay diffable against
# the backend — `localize.py` differs from `v1_5_logic.py` in four import lines, and
# annotating it (or wrapping its arrays in the `cast_batch` no-ops mypy wants) would
# spend that property to satisfy a linter. `vendored/` is copied outright.
#
# Everything else under toolbox/ IS checked, including the tests.
[[tool.mypy.overrides]]
module = [
    "toolbox.bricks.vendored.*",
    "toolbox.bricks.localize",
    "toolbox.bricks.candidates",
    "toolbox.bricks.ingest",
]
ignore_errors = true
disallow_untyped_defs = false
warn_return_any = false
